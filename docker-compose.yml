services:
  eshop-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eshop-unified-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - RESEND_API=${RESEND_API}
    volumes:
      - eshop-data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  eshop-data:
