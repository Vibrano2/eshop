services:
  eshop-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eshop-unified-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SESSION_SECRET=eshop-secret-super-secure-key-2026
      - ADMIN_API_KEY=admin-secret-eshop-2026
    volumes:
      - eshop-data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  eshop-data:
